<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mini Masterpiece | Dreamscape</title>
<style>
:root{
  --ink:#2f2a2a;
  --cream:#fffaf4;
  --pink:#f6dce7;
  --soft:#f3eee9;
  --accent:#c98fa7;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--cream)}
header{padding:28px 20px;text-align:center;background:white;border-bottom:1px solid #eee}
.brand-logo{width:min(100%,900px);height:auto;max-height:260px;object-fit:contain;border-radius:18px;margin:0 auto 12px;display:block}.logo{font-size:34px;font-weight:700;letter-spacing:2px}
.tag{margin-top:6px;color:#777}
nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}
nav button{border:0;background:var(--soft);padding:11px 18px;border-radius:24px;font-weight:600;cursor:pointer}
.hero{padding:55px 20px;text-align:center;background:linear-gradient(180deg,#fff,#fff6f8)}
.hero h1{font-size:42px;margin:0 0 12px}
.hero p{max-width:650px;margin:0 auto 25px;line-height:1.6;color:#666}
.cta{display:inline-block;background:var(--accent);color:white;text-decoration:none;padding:13px 22px;border-radius:28px;font-weight:700}
section{max-width:1050px;margin:auto;padding:45px 20px}
h2{text-align:center;font-size:30px;margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.card{background:white;border-radius:22px;padding:25px;box-shadow:0 8px 25px rgba(0,0,0,.07)}.product-photo{width:100%;max-width:520px;display:block;margin:0 auto 20px;border-radius:18px}
.price{font-size:26px;font-weight:800;margin:8px 0 15px}
ul{line-height:1.8;padding-left:22px}
.option-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.figure{border:2px solid #eee;border-radius:16px;padding:18px;text-align:center;background:white;cursor:pointer}
.figure.selected{border-color:var(--accent);background:#fff1f6}
.figure .shape{height:60px;border-radius:12px;background:#eee;margin-bottom:8px;display:flex;align-items:center;justify-content:center;font-size:28px}
.note{background:#fff1f6;border-radius:18px;padding:18px;margin:20px 0;line-height:1.5}
.colour-box{background:#fff8fb;border:2px solid #f0dbe4;border-radius:20px;padding:20px;margin-top:20px}.colour-help{color:#777;margin-top:-6px}.colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:12px}
.color{border:2px solid #ddd;border-radius:14px;padding:9px;background:white;cursor:pointer;text-align:center;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;display:block;position:relative;z-index:5}.color:active{transform:scale(.98)}
.swatch{height:48px;border-radius:10px;margin-bottom:7px;border:1px solid #ddd}
.color.selected{border-color:var(--accent);box-shadow:0 0 0 4px rgba(201,143,167,.28);background:#fff1f6}.color.selected:after{content:"✓";position:absolute;top:6px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:white;font-weight:900;line-height:24px}.swatch{pointer-events:none}
.count{font-weight:700;text-align:center;margin:15px}
.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.category{border:2px solid #eee;background:white;padding:18px;border-radius:16px;cursor:pointer;text-align:center;font-weight:700}
.category.selected{border-color:var(--accent);background:#fff1f6}
.contact{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.contact a{padding:13px 18px;border-radius:25px;text-decoration:none;font-weight:700}
.whatsapp{background:#25D366;color:white}
footer{text-align:center;padding:30px;background:#fff;border-top:1px solid #eee;color:#777}
.small{font-size:13px;color:#777}.order-summary{background:#f8f3f5;border-radius:16px;padding:16px;margin-top:18px;line-height:1.55}.order-btn{margin-top:10px}
button.primary{border:0;background:var(--accent);color:#fff;padding:13px 20px;border-radius:25px;font-weight:700;cursor:pointer}
</style>
<style>
nav a{border:0;background:var(--soft);padding:11px 18px;border-radius:24px;font-weight:600;text-decoration:none;color:var(--ink)}
.hero{padding:65px 20px}
.hero h1{font-size:42px}
.hero-contact{margin-top:24px}
.section-intro{max-width:720px;margin:-10px auto 28px;text-align:center;line-height:1.6;color:#666}
.card h3{font-size:28px;margin:5px 0}
.note{margin-top:18px}
.category-list{background:#f8f3f5;border-radius:14px;padding:16px;line-height:1.8;text-align:center}
.colour-display{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px;max-width:900px;margin:auto}
.display-colour{background:#fff;border:2px solid #eee;border-radius:14px;padding:10px;display:flex;align-items:center;gap:10px;font-weight:600}
.display-colour span{width:38px;height:38px;border-radius:10px;border:1px solid #ddd;display:block;flex:0 0 38px}
.contact-section{text-align:center;background:#fff6f8;border-radius:28px;margin:20px auto 45px;max-width:1050px}
.big-contact{font-size:16px}
@media(max-width:600px){.hero h1{font-size:32px}.brand-logo{max-height:210px}.card{padding:18px}}
</style>
</head>

<header>
